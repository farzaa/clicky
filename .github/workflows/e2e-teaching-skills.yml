name: E2E Teaching Skills

on:
  push:
    branches:
      - main
      - feature/teaching-skills
  pull_request:
    branches:
      - main
      - feature/teaching-skills

jobs:
  teaching-skills-e2e:
    name: Teaching skills E2E (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -destination 'platform=macOS' \
            -only-testing:leanring-buddyTests/TeachingSkillTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run teaching-skills E2E
        run: |
          chmod +x tests/e2e/run-all.sh tests/e2e/*.sh tests/e2e/lib/common.sh
          ./tests/e2e/run-all.sh

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-skills-e2e-logs
          if-no-files-found: ignore
          path: |
            /tmp/clicky-e2e-app.log
            /tmp/clicky-e2e-app-read.log
            /tmp/clicky-e2e-niche-*.log
            /tmp/clicky-e2e-library-*.log
            /tmp/clicky-e2e-journey-*.log
            /tmp/clicky-e2e-worker.log
            /tmp/clicky-e2e-build.log
            ~/.clicky/e2e-last-system-prompt.txt
            ~/.clicky/e2e-last-suggestions.txt
            ~/.clicky/e2e-skill-library-state.txt
