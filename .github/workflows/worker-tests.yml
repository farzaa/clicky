name: Worker tests

on:
  push:
    paths: ["worker/**", ".github/workflows/worker-tests.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
