# Cloudflare Worker config for a vibe-id project proxy.
#
# To bootstrap a new project:
#   1. Replace `myproject` everywhere below with your project id.
#   2. Set the route's pattern to your custom domain (Cloudflare must
#      already manage that zone, or use a workers.dev subdomain instead).
#   3. `npx wrangler secret put VIBE_ID_INTERNAL_KEY` (must match vibe-id's value).
#   4. `npx wrangler deploy`.

name = "myproject-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

routes = [
  { pattern = "api.myproject.your-domain.example", custom_domain = true }
]

# Service binding to the deployed `vibe-id` worker. Calls run in-process
# on the same edge node — no public HTTPS hop. The proxy layer costs ~0ms.
[[services]]
binding = "VIBE_ID"
service = "vibe-id"
