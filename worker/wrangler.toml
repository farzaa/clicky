name = "dot-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

# Bind the worker to a custom domain on the vibe-research.net Cloudflare zone.
# `custom_domain = true` makes Cloudflare provision the DNS record + edge
# routing automatically, no manual CNAME needed.
routes = [
  { pattern = "api.dot.vibe-research.net", custom_domain = true }
]

# ----------------------------------------------------------------------------
# Dot inference proxy. Identity (users, OAuth, install tokens, quotas, admin)
# lives in the central `vibe-id` worker. This worker is stateless: it just
# verifies the bearer token with vibe-id, proxies to upstream APIs, and
# reports usage back to vibe-id.
#
# Local dev runs on port 8787; vibe-id runs on 8790.
# ----------------------------------------------------------------------------

[vars]
ELEVENLABS_VOICE_ID = "kPzsL2i3teMYv0FxEYQ6"
VIBE_ID_BASE_URL = "https://api.accounts.vibe-research.net"

# ----------------------------------------------------------------------------
# Secrets are NOT defined here. Set them with `wrangler secret put`:
#   ANTHROPIC_API_KEY
#   ASSEMBLYAI_API_KEY
#   ELEVENLABS_API_KEY
#   VIBE_ID_INTERNAL_KEY  — must match the value set in vibe-id's secrets
# ----------------------------------------------------------------------------
