name = "dot-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

# Bind the worker to a custom domain on the vibe-research.net Cloudflare zone.
# `custom_domain = true` makes Cloudflare provision the DNS record + edge
# routing automatically, no manual CNAME needed.
routes = [
  { pattern = "api.dot.vibe-research.net", custom_domain = true }
]

# Stateless forwarder. All upstream API keys live in vibe-id; this worker
# just relays /chat, /tts, /transcribe-token to vibe-id's /v1/proxy/*
# endpoints, which combine auth + quota + upstream call + usage in one trip.
#
# Service binding makes the forward an in-process call to the deployed
# vibe-id worker (~0ms vs ~25ms for a public HTTPS hop), so adding the
# proxy worker hop costs nothing measurable.
#
# Only secret needed: VIBE_ID_INTERNAL_KEY  — must match vibe-id's value.
# Set with: npx wrangler secret put VIBE_ID_INTERNAL_KEY

[vars]
VIBE_ID_BASE_URL = "https://api.accounts.vibe-research.net"

[[services]]
binding = "VIBE_ID"
service = "vibe-id"
