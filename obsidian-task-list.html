<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Tasks — BPTMaster</title>
<style>
  :root {
    --bg: #141418;
    --bg-soft: #1c1c22;
    --card: #222228;
    --card-hover: #2a2a33;
    --border: #31313c;
    --text: #e6e6ec;
    --text-dim: #9a9aa8;
    --text-faint: #6a6a78;
    --accent: #a78bfa;
    --accent-soft: rgba(167, 139, 250, 0.14);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.13);
    --amber: #fbbf24;
    --amber-soft: rgba(251, 191, 36, 0.13);
    --blue: #60a5fa;
    --blue-soft: rgba(96, 165, 250, 0.13);
    --green: #4ade80;
    --green-soft: rgba(74, 222, 128, 0.13);
    --gray: #8b8b99;
    --gray-soft: rgba(139, 139, 153, 0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #232338 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  h1 .vault-icon { font-size: 22px; }
  .meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .meta code {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--accent);
  }
  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 24px 0; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.02em; }
  .stat.overdue .num { color: var(--red); }
  .stat.open .num { color: var(--accent); }
  .stat.wip .num { color: var(--amber); }
  .stat.done .num { color: var(--green); }
  /* Filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 14px; }
  .filters button {
    background: var(--card); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.15s ease;
  }
  .filters button:hover { background: var(--card-hover); color: var(--text); }
  .filters button.active {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  /* Task list */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 16px; display: flex; align-items: center; gap: 14px;
    transition: background 0.15s ease;
  }
  .task:hover { background: var(--card-hover); }
  .task.is-done { opacity: 0.55; }
  .task.is-done .title { text-decoration: line-through; color: var(--text-dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.open { background: var(--accent); }
  .dot.in-progress { background: var(--amber); }
  .dot.done { background: var(--green); }
  .task .body { flex: 1; min-width: 0; }
  .task .title { font-size: 14.5px; font-weight: 500; }
  .task .sub { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    letter-spacing: 0.02em; white-space: nowrap;
  }
  .badge.pri-high   { background: var(--red-soft); color: var(--red); }
  .badge.pri-normal { background: var(--blue-soft); color: var(--blue); }
  .badge.pri-low    { background: var(--gray-soft); color: var(--gray); }
  .badge.due        { background: var(--bg-soft); color: var(--text-dim); border: 1px solid var(--border); }
  .badge.overdue    { background: var(--red-soft); color: var(--red); border: 1px solid rgba(248,113,113,0.35); }
  .badge.soon       { background: var(--amber-soft); color: var(--amber); }
  .empty { color: var(--text-faint); text-align: center; padding: 40px 0; font-size: 14px; }
  footer { margin-top: 32px; color: var(--text-faint); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

<script>

  { title: "Bin confidential papers", status: "open", priority: "high", due: "2026-10-18", scheduled: "2026-10-18" },
  { title: "email ash about research", status: "open", priority: "high", due: "2026-10-18", scheduled: "2026-10-18" },

  { title: "Work 0830-1630 (Tue 20 Oct)", status: "open", priority: "normal", due: "2026-10-20T16:30", scheduled: "2026-10-20T08:30" },

  { title: "basketball league sort out", status: "open", priority: "low", due: "2026-11-01", scheduled: "2026-10-18" },
  { title: "SMSF 25-26 TAX REPORT", status: "open", priority: "high", due: "2026-11-01", scheduled: "2026-10-18" },
  { title: "book dental appt", status: "open", priority: "low", due: "2026-11-22", scheduled: "2026-10-18" },
  { title: "CPD Compliance", status: "open", priority: "high", due: "2026-11-30", scheduled: "2026-10-18" },
  { title: "KI complete 24-25, 25-26 reports.", status: "open", priority: "high", due: "2026-11-30", scheduled: "2026-10-18" },
  { title: "Set up SMSF ETFS", status: "open", priority: "low", due: "2026-12-31", scheduled: "2026-10-18" },
  { title: "wrap up smsf and priv investment crypto", status: "open", priority: "low", due: "2026-12-31", scheduled: "2026-10-18" },
  { title: "cancel meal plan", status: "open", priority: "high", due: null, scheduled: "2026-10-18" },
  { title: "confirm cancel coffee subscription", status: "open", priority: "high", due: null, scheduled: "2026-10-18" }
];

// ---- Snapshot reference date (matches header) ----
const TODAY = new Date(2026, 10, 2); // Mon Nov 2 2026, local midnight

function startOfDay(d) { const c = new Date(d); c.setHours(0,0,0,0); return c; }
function daysOverdue(dueStr) {
  const due = new Date(dueStr);
  return Math.round((startOfDay(TODAY) - startOfDay(due)) / 86400000);
}
function fmtDue(dueStr) {
  const d = new Date(dueStr);
  const dateStr = d.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" });
  const hasTime = dueStr.includes("T") && !/T00:00$/.test(dueStr);
  return hasTime ? dateStr + ", " + d.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit" }) : dateStr;
}
function dueBadge(task) {
  if (!task.due) return `<span class="badge due">no due date</span>`;
  const overdue = daysOverdue(task.due);
  if (task.status !== "done" && overdue > 0) {
    return `<span class="badge overdue">&#9888; ${fmtDue(task.due)} &middot; ${overdue}d overdue</span>`;
  }
  if (task.status !== "done") {
    return `<span class="badge soon">${fmtDue(task.due)}</span>`;
  }
  return `<span class="badge due">${fmtDue(task.due)}</span>`;
}
function priorityBadge(p) {
  return `<span class="badge pri-${p}">${p}</span>`;
}
function sortKey(t) {
  if (t.status === "done") return t.completed || "9999";
  if (!t.due) return "9999";
  return t.due;
}

// ---- Stats ----
const counts = {
  total: TASKS.length,
  open: TASKS.filter(t => t.status === "open").length,
  wip: TASKS.filter(t => t.status === "in-progress").length,
  done: TASKS.filter(t => t.status === "done").length,
  overdue: TASKS.filter(t => t.status !== "done" && t.due && daysOverdue(t.due) > 0).length
};
document.getElementById("stats").innerHTML = [
  { cls: "", lbl: "Total tasks", num: counts.total },
  { cls: "open", lbl: "Open", num: counts.open },
  { cls: "wip", lbl: "In progress", num: counts.wip },
  { cls: "done", lbl: "Done", num: counts.done },
  { cls: "overdue", lbl: "Overdue", num: counts.overdue }
].map(s => `<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`).join("");

// ---- Filters ----
const FILTERS = [
  { id: "active", label: "Active", match: t => t.status !== "done" },
  { id: "open", label: "Open", match: t => t.status === "open" },
  { id: "in-progress", label: "In progress", match: t => t.status === "in-progress" },
  { id: "done", label: "Done", match: t => t.status === "done" },
  { id: "all", label: "All", match: () => true }
];
let currentFilter = "active";

function render() {
  const filter = FILTERS.find(f => f.id === currentFilter);
  const tasks = TASKS.filter(filter.match).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  const list = document.getElementById("list");
  if (!tasks.length) { list.innerHTML = `<div class="empty">Nothing here.</div>`; return; }
  list.innerHTML = tasks.map(t => `
    <div class="task ${t.status === "done" ? "is-done" : ""}">
      <span class="dot ${t.status}"></span>
      <div class="body">
        <div class="title">${t.title}</div>
        <div class="sub">${t.status === "done" && t.completed ? "Completed " + fmtDue(t.completed) : (t.scheduled ? "Scheduled " + fmtDue(t.scheduled) : "")}</div>
      </div>
      <div class="badges">${priorityBadge(t.priority)}${dueBadge(t)}</div>
    </div>`).join("");
}
document.getElementById("filters").innerHTML = FILTERS.map(f =>
  `<button data-id="${f.id}" class="${f.id === currentFilter ? "active" : ""}">${f.label}</button>`).join("");
document.getElementById("filters").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  currentFilter = e.target.dataset.id;
  document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("active", b.dataset.id === currentFilter));
  render();
});
render();
</script>
</body>
