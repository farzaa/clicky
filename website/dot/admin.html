<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot — admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="row between">
      <a href="index.html" class="brand"><span class="brand-dot"></span> Dot · admin</a>
      <a href="index.html" class="muted">← Home</a>
    </header>

    <section class="hero" style="margin-top: 36px;">
      <h1>Admin</h1>
      <p>Sign in with the whitelisted Google account to view usage and users.</p>
    </section>

    <section class="section" id="authSection">
      <div class="card">
        <div class="stack">
          <p id="authStatus" class="muted" style="margin: 0;">Checking sign-in…</p>
          <div class="row" style="gap: 8px;">
            <a id="signInButton" class="button" href="#" style="display: none;">Sign in with Google</a>
            <button id="refreshButton" class="button" style="display: none;">Refresh</button>
            <button id="signOutButton" class="button secondary" style="display: none;">Sign out</button>
          </div>
        </div>
        <p id="errorBox" class="error" style="display: none;"></p>
      </div>
    </section>

    <section class="section" id="usersSection" style="display: none;">
      <h2>Users</h2>
      <div class="card" style="padding: 0;">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Status</th>
              <th>Last seen</th>
              <th colspan="3">Usage today by project</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="section" id="usageSection" style="display: none;">
      <h2>Usage (last 30 days)</h2>
      <div class="card" style="padding: 0;">
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Project</th>
              <th>Endpoint</th>
              <th>Calls</th>
              <th>Total amount</th>
            </tr>
          </thead>
          <tbody id="usageTableBody"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <span>© Dot · admin</span>
      <span><a href="index.html">Home</a></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      var config = window.DOT_CONFIG || {};
      var vibeIdBaseURL = (config.vibeIdBaseURL || "").replace(/\/$/, "");

      var PROJECT_ID_FOR_AUTH = "dot";
      var TOKEN_STORAGE_KEY = "vibeResearch.installToken";
      var EMAIL_STORAGE_KEY = "vibeResearch.email";

      function showErrorMessage(messageText) {
        var errorBox = document.getElementById("errorBox");
        errorBox.textContent = messageText;
        errorBox.style.display = "block";
      }
      function clearErrorMessage() {
        document.getElementById("errorBox").style.display = "none";
      }
      function setVisibility(elementId, visible) {
        document.getElementById(elementId).style.display = visible ? "" : "none";
      }

      function consumeAuthCallbackFragmentIfPresent() {
        if (!window.location.hash) return;
        var fragmentParameters = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var receivedToken = fragmentParameters.get("token");
        var receivedEmail = fragmentParameters.get("email");
        if (receivedToken) {
          localStorage.setItem(TOKEN_STORAGE_KEY, receivedToken);
          if (receivedEmail) localStorage.setItem(EMAIL_STORAGE_KEY, receivedEmail);
          history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      }

      function buildSignInUrl() {
        var returnTo = window.location.origin.replace(/\/$/, "") + window.location.pathname;
        return vibeIdBaseURL + "/auth/start?project=" + encodeURIComponent(PROJECT_ID_FOR_AUTH) +
          "&return_to=" + encodeURIComponent(returnTo);
      }

      function hideAdminTables() {
        setVisibility("usersSection", false);
        setVisibility("usageSection", false);
      }

      function showSignedOut() {
        hideAdminTables();
        document.getElementById("authStatus").textContent = "Not signed in.";
        document.getElementById("signInButton").setAttribute("href", buildSignInUrl());
        setVisibility("signInButton", true);
        setVisibility("refreshButton", false);
        setVisibility("signOutButton", false);
      }

      function showSignedIn(emailAddress) {
        document.getElementById("authStatus").textContent = "Signed in as " + emailAddress + ".";
        setVisibility("signInButton", false);
        setVisibility("refreshButton", true);
        setVisibility("signOutButton", true);
      }

      function clearStoredAuth() {
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        localStorage.removeItem(EMAIL_STORAGE_KEY);
      }

      function formatUnixSeconds(unixSeconds) {
        if (!unixSeconds) return "—";
        var date = new Date(unixSeconds * 1000);
        return date.toLocaleString();
      }

      function dayBucketToDateLabel(dayBucket) {
        // dayBucket = floor(unix_seconds / 86400). Convert back to a readable date.
        var unixSeconds = dayBucket * 86400;
        var date = new Date(unixSeconds * 1000);
        return date.toISOString().slice(0, 10);
      }

      async function loadAdminData() {
        clearErrorMessage();
        var installToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (!installToken) {
          showSignedOut();
          return;
        }

        var authorizationHeaders = { authorization: "Bearer " + installToken };

        try {
          var meResponse = await fetch(vibeIdBaseURL + "/auth/me", { headers: authorizationHeaders });
          if (meResponse.status === 401) {
            clearStoredAuth();
            showSignedOut();
            showErrorMessage("Your sign-in expired. Sign in again.");
            return;
          }
          if (!meResponse.ok) {
            hideAdminTables();
            showErrorMessage("Couldn't load your account (" + meResponse.status + ").");
            return;
          }
          var meJson = await meResponse.json();
          var signedInEmail = meJson.user && meJson.user.email ? meJson.user.email : localStorage.getItem(EMAIL_STORAGE_KEY) || "unknown account";
          localStorage.setItem(EMAIL_STORAGE_KEY, signedInEmail);
          showSignedIn(signedInEmail);

          var [usersResponse, usageResponse] = await Promise.all([
            fetch(vibeIdBaseURL + "/admin/users", { headers: authorizationHeaders }),
            fetch(vibeIdBaseURL + "/admin/usage", { headers: authorizationHeaders }),
          ]);
          if (usersResponse.status === 401 || usageResponse.status === 401) {
            clearStoredAuth();
            showSignedOut();
            showErrorMessage("Your sign-in expired. Sign in again.");
            return;
          }
          if (usersResponse.status === 403 || usageResponse.status === 403) {
            hideAdminTables();
            showErrorMessage("This Google account is not on the Dot admin allowlist.");
            return;
          }
          if (!usersResponse.ok) { showErrorMessage("Failed to load users (" + usersResponse.status + ")"); return; }
          if (!usageResponse.ok) { showErrorMessage("Failed to load usage (" + usageResponse.status + ")"); return; }

          var usersJson = await usersResponse.json();
          var usageJson = await usageResponse.json();
          renderUsersTable(usersJson.users || []);
          renderUsageTable(usageJson.usage || []);
          setVisibility("usersSection", true);
          setVisibility("usageSection", true);
        } catch (networkError) {
          hideAdminTables();
          showErrorMessage("Couldn't reach the identity server: " + networkError.message);
        }
      }

      function summarizeUsageByProject(usageByProject) {
        // Render as: "dot: chat 3, tts 412 · swarmlab: chat 1"
        if (!usageByProject || Object.keys(usageByProject).length === 0) return "—";
        return Object.entries(usageByProject).map(function (projectEntry) {
          var projectId = projectEntry[0];
          var endpoints = projectEntry[1] || {};
          var endpointSummary = Object.entries(endpoints).map(function (endpointEntry) {
            return endpointEntry[0] + " " + endpointEntry[1];
          }).join(", ");
          return projectId + ": " + endpointSummary;
        }).join(" · ");
      }

      function renderUsersTable(userRows) {
        var tableBody = document.getElementById("usersTableBody");
        tableBody.innerHTML = "";
        userRows.forEach(function (userRow) {
          var rowElement = document.createElement("tr");
          rowElement.innerHTML =
            "<td>" + escapeHtml(userRow.email) + "</td>" +
            "<td>" + escapeHtml(userRow.status) + "</td>" +
            "<td>" + formatUnixSeconds(userRow.last_seen_at) + "</td>" +
            "<td colspan='3'>" + escapeHtml(summarizeUsageByProject(userRow.usage_today_by_project)) + "</td>";
          tableBody.appendChild(rowElement);
        });
        if (userRows.length === 0) {
          tableBody.innerHTML = "<tr><td colspan='6' class='muted'>No users yet.</td></tr>";
        }
      }

      function renderUsageTable(usageRows) {
        var tableBody = document.getElementById("usageTableBody");
        tableBody.innerHTML = "";
        usageRows.forEach(function (usageRow) {
          var rowElement = document.createElement("tr");
          rowElement.innerHTML =
            "<td>" + dayBucketToDateLabel(usageRow.day_bucket) + "</td>" +
            "<td>" + escapeHtml(usageRow.project_id || "—") + "</td>" +
            "<td>" + escapeHtml(usageRow.endpoint) + "</td>" +
            "<td>" + usageRow.event_count + "</td>" +
            "<td>" + usageRow.total_amount + "</td>";
          tableBody.appendChild(rowElement);
        });
        if (usageRows.length === 0) {
          tableBody.innerHTML = "<tr><td colspan='5' class='muted'>No usage yet.</td></tr>";
        }
      }

      function escapeHtml(unsafeText) {
        return String(unsafeText == null ? "" : unsafeText).replace(/[&<>"']/g, function (singleChar) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[singleChar];
        });
      }

      consumeAuthCallbackFragmentIfPresent();
      document.getElementById("signInButton").setAttribute("href", buildSignInUrl());
      document.getElementById("refreshButton").addEventListener("click", loadAdminData);
      document.getElementById("signOutButton").addEventListener("click", async function () {
        var installToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (installToken) {
          try {
            await fetch(vibeIdBaseURL + "/auth/signout", {
              method: "POST",
              headers: { authorization: "Bearer " + installToken },
            });
          } catch (_ignored) { /* best-effort sign-out */ }
        }
        clearStoredAuth();
        clearErrorMessage();
        showSignedOut();
      });
      loadAdminData();
    })();
  </script>
</body>
</html>
