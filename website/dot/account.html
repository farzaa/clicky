<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Vibe Research account</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="row between">
      <a href="index.html" class="brand"><span class="brand-dot"></span> Dot</a>
      <a href="index.html" class="muted">← Home</a>
    </header>

    <section class="hero" style="margin-top: 36px;">
      <h1 id="greeting">Your account</h1>
      <p id="subtitle">Sign in to see your daily usage and limits.</p>
    </section>

    <section id="signedOutSection" class="section" style="display: none;">
      <div class="card">
        <p style="margin-top: 0;">You're not signed in yet. Click below to sign in with Google. We use Google so we can track usage per account and you can avoid the password handling.</p>
        <a id="signInButton" href="#" class="button">Sign in with Google</a>
      </div>
    </section>

    <section id="signedInSection" class="section" style="display: none;">
      <div class="card">
        <div class="row between" style="align-items: center;">
          <div id="emailLabel" style="font-size: 14px; color: var(--text-secondary);"></div>
          <button id="signOutButton" class="button danger">Sign out</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px;">
          <div>
            <div class="label">Balance</div>
            <div style="font-size: 24px; font-weight: 700; margin-top: 2px;"><span id="creditsBalance">—</span></div>
          </div>
          <div id="dailyCapBlock" style="display: none;">
            <div class="label">Today</div>
            <div style="font-size: 24px; font-weight: 700; margin-top: 2px;">
              <span id="spentTodayLabel">—</span>
              <span style="font-size: 14px; color: var(--text-tertiary); font-weight: 400;"> / <span id="dailyCapLabel">—</span></span>
            </div>
            <div style="margin-top: 8px; height: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; overflow: hidden;">
              <div id="spentTodayBar" style="height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p id="errorBox" class="error" style="display: none;"></p>

    <footer>
      <span>© Dot</span>
      <span><a href="index.html">Home</a></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      var config = window.DOT_CONFIG || {};
      var vibeIdBaseURL = (config.vibeIdBaseURL || "").replace(/\/$/, "");
      var PROJECT_ID = "dot";

      // Storage keys for the install token + cached email so we can show the
      // signed-in state on subsequent visits without round-tripping the worker.
      var TOKEN_STORAGE_KEY = "dot.installToken";
      var EMAIL_STORAGE_KEY = "dot.email";

      // Pull token + email out of the URL fragment (set by /auth/callback) on
      // first arrival, then strip them so they don't sit in the address bar.
      function consumeAuthCallbackFragmentIfPresent() {
        if (!window.location.hash) return;
        var fragmentParameters = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var receivedToken = fragmentParameters.get("token");
        var receivedEmail = fragmentParameters.get("email");
        if (receivedToken) {
          localStorage.setItem(TOKEN_STORAGE_KEY, receivedToken);
          if (receivedEmail) localStorage.setItem(EMAIL_STORAGE_KEY, receivedEmail);
          history.replaceState(null, "", window.location.pathname);
        }
      }

      function showErrorMessage(messageText) {
        var errorBox = document.getElementById("errorBox");
        errorBox.textContent = messageText;
        errorBox.style.display = "block";
      }

      function setVisibility(elementId, visible) {
        document.getElementById(elementId).style.display = visible ? "" : "none";
      }

      function buildSignInUrl() {
        var websiteOrigin = window.location.origin;
        var returnTo = websiteOrigin.replace(/\/$/, "") + window.location.pathname;
        return vibeIdBaseURL + "/auth/start?project=" + encodeURIComponent(PROJECT_ID) + "&return_to=" + encodeURIComponent(returnTo);
      }

      function showSignedOut() {
        setVisibility("signedInSection", false);
        setVisibility("signedOutSection", true);
        document.getElementById("greeting").textContent = "Your account";
        document.getElementById("subtitle").textContent = "Sign in to see your daily usage and limits.";
        var signInButton = document.getElementById("signInButton");
        if (signInButton && vibeIdBaseURL) {
          signInButton.setAttribute("href", buildSignInUrl());
        }
      }

      function formatCents(cents) {
        return "$" + (cents / 100).toFixed(2);
      }

      function renderDailyCapBar(meResponse) {
        var capCents = meResponse.daily_cap_cents;
        var spentCents = meResponse.spent_today_cents;
        var block = document.getElementById("dailyCapBlock");
        if (typeof capCents !== "number" || typeof spentCents !== "number" || capCents <= 0) {
          block.style.display = "none";
          return;
        }
        block.style.display = "";
        document.getElementById("spentTodayLabel").textContent = formatCents(spentCents);
        document.getElementById("dailyCapLabel").textContent = formatCents(capCents);

        var fillPercent = Math.min(100, Math.max(0, (spentCents / capCents) * 100));
        var barElement = document.getElementById("spentTodayBar");
        barElement.style.width = fillPercent + "%";
        if (fillPercent >= 90) {
          barElement.style.background = "var(--danger)";
        } else if (fillPercent >= 70) {
          barElement.style.background = "#f59e0b";
        } else {
          barElement.style.background = "var(--accent)";
        }
      }

      function showSignedInWithMe(meResponse) {
        setVisibility("signedOutSection", false);
        setVisibility("signedInSection", true);
        var displayName = meResponse.user.display_name || meResponse.user.email;
        document.getElementById("greeting").textContent = "Hi, " + displayName;
        document.getElementById("subtitle").textContent = "Your Vibe Research account.";
        document.getElementById("emailLabel").textContent = meResponse.user.email;
        var creditsBalanceElement = document.getElementById("creditsBalance");
        if (creditsBalanceElement) {
          creditsBalanceElement.textContent = (typeof meResponse.credits_balance === "number")
            ? formatCents(meResponse.credits_balance)
            : "—";
        }
        renderDailyCapBar(meResponse);
      }


      async function loadAccount() {
        var installToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (!installToken) {
          showSignedOut();
          return;
        }

        try {
          var meResponse = await fetch(vibeIdBaseURL + "/auth/me", {
            headers: { authorization: "Bearer " + installToken },
          });
          if (meResponse.status === 401) {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            showSignedOut();
            return;
          }
          if (!meResponse.ok) {
            showErrorMessage("Couldn't load your account (status " + meResponse.status + ").");
            return;
          }
          var responseJson = await meResponse.json();
          showSignedInWithMe(responseJson);
        } catch (networkError) {
          showErrorMessage("Couldn't reach the identity server: " + networkError.message);
        }
      }

      async function handleSignOutClick() {
        var installToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (installToken) {
          try {
            await fetch(vibeIdBaseURL + "/auth/signout", {
              method: "POST",
              headers: { authorization: "Bearer " + installToken },
            });
          } catch (_ignored) { /* best-effort */ }
        }
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        localStorage.removeItem(EMAIL_STORAGE_KEY);
        showSignedOut();
      }

      consumeAuthCallbackFragmentIfPresent();
      document.getElementById("signOutButton").addEventListener("click", handleSignOutClick);
      loadAccount();
    })();
  </script>
</body>
</html>
