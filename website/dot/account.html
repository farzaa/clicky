<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to your Vibe Research account…</title>
  <meta name="robots" content="noindex" />
  <script>
    // The Dot account page used to live here. It moved to vibe-research.net/account
    // so usage across every Vibe Research product (Dot, Swarmlab, …) lives in one
    // place. Forward any token + email the OAuth callback left in our fragment so
    // first-time sign-ins from dot.vibe-research.net still land signed in.
    (function () {
      var destination = "https://vibe-research.net/account.html";
      if (window.location.hash) destination += window.location.hash;
      window.location.replace(destination);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://vibe-research.net/account.html" />
</head>
<body>
  <p>Your account moved to <a href="https://vibe-research.net/account.html">vibe-research.net/account</a>.</p>
</body>
</html>
